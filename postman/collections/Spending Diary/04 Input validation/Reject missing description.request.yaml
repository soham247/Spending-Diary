"$kind": "http-request"
"name": "Reject missing description"
"order": 4000
"method": "POST"
"url": "{{base_url}}/api/expenses/create"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{run_id}}-invalid-missing description"
"body":
  "type": "json"
  "content": |-
    {
      "description": "",
      "category": "Food",
      "amount": 10001,
      "currency": "INR",
      "date": "{{date}}",
      "splitType": "EQUAL",
      "participants": [
        {
          "userId": "{{owner_id}}",
          "paid": 10001
        },
        {
          "userId": "{{friend_id}}",
          "paid": 0
        }
      ]
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
