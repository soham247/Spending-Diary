"$kind": "http-request"
"name": "Payment reduces debt"
"order": 4000
"method": "GET"
"url": "{{base_url}}/api/balances"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Settlement reduces debt from 5000 to 3000',()=>{const row=pm.response.json().data.find(r=>r.currency==='INR'&&r.scopeId===pm.environment.get('settlement_group_id'));pm.expect(Math.abs(row.amount)).to.eql(3000);});
