"$kind": "http-request"
"name": "Report wrong claim without reversing history"
"order": 22000
"method": "POST"
"url": "{{base_url}}/api/invites/{{direct_invite_id}}/report"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{run_id}}-claimreport"
"body":
  "type": "json"
  "content": |-
    {
      "reason": "Contract report"
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
