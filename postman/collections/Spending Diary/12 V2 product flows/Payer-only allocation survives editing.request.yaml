"$kind": "http-request"
"name": "Payer-only allocation survives editing"
"order": 35000
"method": "GET"
"url": "{{base_url}}/api/expenses/{{payer_only_id}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Payer owes zero and both consumers owe 4500',()=>{const e=pm.response.json().data;const payer=e.participants.find(p=>p.userId===pm.environment.get('owner_id'));pm.expect(payer.paid).to.eql(9000);pm.expect(payer.owed).to.eql(0);pm.expect(payer.includedInSplit).to.eql(false);pm.expect(e.participants.filter(p=>p.userId!==payer.userId).map(p=>p.owed)).to.eql([4500,4500]);});
