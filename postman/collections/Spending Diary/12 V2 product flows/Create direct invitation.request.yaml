"$kind": "http-request"
"name": "Create direct invitation"
"order": 17000
"method": "POST"
"url": "{{base_url}}/api/invites"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{run_id}}-directinvite"
"body":
  "type": "json"
  "content": |-
    {
      "type": "DIRECT",
      "placeholderId": "{{placeholder_id}}"
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.collectionVariables.set('direct_token',pm.response.json().data.token);pm.collectionVariables.set('direct_invite_id',pm.response.json().data.id);
