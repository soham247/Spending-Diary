"$kind": "http-request"
"name": "Replay group creation"
"order": 2000
"method": "POST"
"url": "{{base_url}}/api/groups"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{run_id}}-newgroup"
"body":
  "type": "json"
  "content": |-
    {
      "name": "Contract trip {{run_id}}"
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Group ID reused',()=>pm.expect(pm.response.json().data.id).to.eql(pm.collectionVariables.get('new_group_id')));
