"$kind": "http-request"
"name": "Claimer cannot file inviter report"
"order": 23000
"method": "POST"
"url": "{{base_url}}/api/invites/{{direct_invite_id}}/report"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{outsider_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
  -
    "key": "Idempotency-Key"
    "value": "{{run_id}}-forged-report"
"body":
  "type": "json"
  "content": |-
    {
      "reason": "Forged"
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
