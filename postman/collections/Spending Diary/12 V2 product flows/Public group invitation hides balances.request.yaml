"$kind": "http-request"
"name": "Public group invitation hides balances"
"order": 7000
"method": "GET"
"url": "{{base_url}}/api/invites/preview?token={{group_token}}"
"queryParams":
  -
    "key": "token"
    "value": "{{group_token}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{anon_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('No balances disclosed',()=>pm.expect(pm.response.json().data.balances).to.eql([]));
