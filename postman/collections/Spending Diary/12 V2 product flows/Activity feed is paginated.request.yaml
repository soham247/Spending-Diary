"$kind": "http-request"
"name": "Activity feed is paginated"
"order": 25000
"method": "GET"
"url": "{{base_url}}/api/activity"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      const d=pm.response.json().data;pm.test('Bounded activity page',()=>pm.expect(d.items.length).to.be.at.most(30));pm.collectionVariables.set('activity_id',d.items[0].id);
