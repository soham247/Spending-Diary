"$kind": "http-request"
"name": "Preview direct debt"
"order": 18000
"method": "GET"
"url": "{{base_url}}/api/invites/preview?token={{direct_token}}"
"queryParams":
  - "key": "token"
    "value": "{{direct_token}}"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{anon_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Placeholder owes 600',()=>pm.expect(pm.response.json().data.balances[0].net).to.eql(-600));
