"$kind": "http-request"
"name": "Unsupported currency edit is rejected"
"order": 2000
"method": "PATCH"
"url": "{{base_url}}/api/expenses/{{currency_id}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
"body":
  "type": "json"
  "content": |-
    {
      "version": 1,
      "currency": "EUR"
    }
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
