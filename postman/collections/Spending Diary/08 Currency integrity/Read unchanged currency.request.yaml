"$kind": "http-request"
"name": "Read unchanged currency"
"order": 3000
"method": "GET"
"url": "{{base_url}}/api/expenses/{{currency_id}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Rejected currency edit leaves INR unchanged',()=>pm.expect(pm.response.json().data.currency).to.eql('INR'));
