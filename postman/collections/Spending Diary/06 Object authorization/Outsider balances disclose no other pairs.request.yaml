"$kind": "http-request"
"name": "Outsider balances disclose no other pairs"
"order": 8000
"method": "GET"
"url": "{{base_url}}/api/balances"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{outsider_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('All balances involve viewer',()=>pm.response.json().data.forEach(r=>pm.expect([r.userLowId,r.userHighId]).to.include(pm.environment.get('outsider_id'))));
