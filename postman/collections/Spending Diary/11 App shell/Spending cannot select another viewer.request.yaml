"$kind": "http-request"
"name": "Spending cannot select another viewer"
"order": 12000
"method": "GET"
"url": "{{base_url}}/api/expenses?scope=mine&viewerId={{owner_id}}"
"queryParams":
  -
    "key": "scope"
    "value": "mine"
  -
    "key": "viewerId"
    "value": "{{owner_id}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{outsider_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Session scopes spending',()=>{const d=pm.response.json().data;pm.expect(d.items).to.eql([]);pm.expect(d.spendingTotals).to.eql([]);});
