"$kind": "http-request"
"name": "List visible expenses"
"order": 6000
"method": "GET"
"url": "{{base_url}}/api/expenses"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{owner_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Bounded cursor page',()=>{const d=pm.response.json().data;pm.expect(d.items.length).to.be.at.most(30);pm.expect(d).to.have.property('nextCursor');});
