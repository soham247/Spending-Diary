"$kind": "http-request"
"name": "Monthly history rejects invalid months"
"order": 9000
"method": "GET"
"url": "{{base_url}}/api/expenses?history=true&month=2026-13"
"queryParams":
  - "key": "history"
    "value": "true"
  - "key": "month"
    "value": "2026-13"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{owner_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
