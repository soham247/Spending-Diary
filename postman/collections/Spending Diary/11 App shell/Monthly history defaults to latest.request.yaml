"$kind": "http-request"
"name": "Monthly history defaults to latest"
"order": 8000
"method": "GET"
"url": "{{base_url}}/api/expenses?history=true&scope=mine"
"queryParams":
  - "key": "history"
    "value": "true"
  - "key": "scope"
    "value": "mine"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{owner_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Latest month and complete monthly totals',()=>{const d=pm.response.json().data;pm.expect(d.availableMonths).to.be.an('array');pm.expect(d.selectedMonth).to.eql(d.availableMonths[0]??null);d.items.forEach(e=>pm.expect(e.date.slice(0,7)).to.eql(d.selectedMonth));d.monthlySpending.forEach(m=>{pm.expect(m.month).to.eql(d.selectedMonth);m.totals.forEach(t=>pm.expect(Number.isSafeInteger(t.amount)).to.eql(true));});});
