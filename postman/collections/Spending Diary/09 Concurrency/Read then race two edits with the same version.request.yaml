"$kind": "http-request"
"name": "Read then race two edits with the same version"
"order": 2000
"method": "GET"
"url": "{{base_url}}/api/expenses/{{race_id}}"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{owner_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      const version=pm.response.json().data.version; const body={version,description:'Concurrent edit',splitType:'EQUAL',participants:[{userId:pm.environment.get('owner_id'),paid:10001},{userId:pm.environment.get('friend_id'),paid:0}]}; const request={url:pm.environment.get('base_url')+'/api/expenses/'+pm.collectionVariables.get('race_id'),method:'PATCH',header:{'Content-Type':'application/json','Cookie':pm.environment.get('owner_cookie')},body:{mode:'raw',raw:JSON.stringify(body)}}; Promise.all([pm.sendRequest(request),pm.sendRequest(request)]).then(responses=>pm.test('One concurrent edit succeeds and one conflicts',()=>pm.expect(responses.map(r=>r.code).sort()).to.eql([200,409]))).catch(error=>pm.test('Concurrent requests completed',()=>{throw error;}));
