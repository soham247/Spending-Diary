"$kind": "http-request"
"name": "Read target email fixture"
"order": 5000
"method": "GET"
"url": "{{base_url}}/api/me"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{discovery_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.collectionVariables.set('discovery_email',pm.response.json().data.email);pm.test('Private by default',()=>pm.expect(pm.response.json().data.discoverableByEmail).to.eql(false));
