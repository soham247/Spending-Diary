"$kind": "http-request"
"name": "Recipient sees request"
"order": 13000
"method": "GET"
"url": "{{base_url}}/api/friends/requests"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{discovery_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      pm.test('Incoming request',()=>pm.expect(pm.response.json().data.items.some(r=>r.id===pm.collectionVariables.get('discovery_request_id')&&r.incoming)).to.eql(true));
