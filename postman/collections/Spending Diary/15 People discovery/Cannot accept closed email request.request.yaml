"$kind": "http-request"
"name": "Cannot accept closed email request"
"order": 15000
"method": "PATCH"
"url": "{{base_url}}/api/friends/requests/{{discovery_request_id}}"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{discovery_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
  - "key": "Content-Type"
    "value": "application/json"
"body":
  "type": "json"
  "content": |-
    {
      "action": "ACCEPT"
    }
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
