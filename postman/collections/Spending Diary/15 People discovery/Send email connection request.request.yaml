"$kind": "http-request"
"name": "Send email connection request"
"order": 11000
"method": "POST"
"url": "{{base_url}}/api/friends/requests"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{owner_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
  - "key": "Content-Type"
    "value": "application/json"
  - "key": "Idempotency-Key"
    "value": "{{run_id}}-discovery"
"body":
  "type": "json"
  "content": |-
    {
      "userId": "{{discovery_id}}",
      "email": "{{discovery_email}}"
    }
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
      if (pm.response.code === 201) pm.collectionVariables.set('discovery_request_id', pm.response.json().data.id); pm.test('Created resource ID', () => pm.expect(pm.response.json().data.id).to.be.a('string'));
