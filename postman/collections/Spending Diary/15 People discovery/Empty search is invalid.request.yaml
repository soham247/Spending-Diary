"$kind": "http-request"
"name": "Empty search is invalid"
"order": 2000
"method": "POST"
"url": "{{base_url}}/api/people/search"
"settings":
  "followRedirects": false
"headers":
  - "key": "Cookie"
    "value": "{{owner_cookie}}"
  - "key": "Origin"
    "value": "{{base_url}}"
  - "key": "Content-Type"
    "value": "application/json"
"body":
  "type": "json"
  "content": |-
    {
      "query": " "
    }
"scripts":
  - "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
