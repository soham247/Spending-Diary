"$kind": "http-request"
"name": "POST /api/settlements requires a session"
"order": 7000
"method": "POST"
"url": "{{base_url}}/api/settlements"
"settings":
  "followRedirects": false
"headers":
  -
    "key": "Cookie"
    "value": "{{anon_cookie}}"
  -
    "key": "Origin"
    "value": "{{base_url}}"
  -
    "key": "Content-Type"
    "value": "application/json"
"body":
  "type": "json"
  "content": "{}"
"scripts":
  -
    "type": "afterResponse"
    "language": "text/javascript"
    "code": |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('JSON response envelope', () => { const b = pm.response.json(); if (pm.response.code < 400) pm.expect(b).to.have.property('data'); else { pm.expect(b.error.code).to.be.a('string'); pm.expect(b.error.message).to.be.a('string'); } });
