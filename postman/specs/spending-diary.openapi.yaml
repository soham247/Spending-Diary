            - "OUTGOING"
        "requestId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
          "nullable": true
        "source":
          "type": "string"
          "enum":
            - "CONTEXT"
            - "EMAIL"
    "CreateFriendRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "userId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "email":
          "type": "string"
          "format": "email"
          "maxLength": 254
        "token":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
      "oneOf":
        - "required":
            - "userId"
          "not":
            "required":
              - "token"
        - "required":
