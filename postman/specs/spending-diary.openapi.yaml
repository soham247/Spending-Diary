"openapi": "3.0.3"
"info":
  "title": "Spending Diary API"
  "version": "1.0.0"
  "description": "Contract and route inventory for the local checkout. Money uses integer minor units. Authentication is managed by Better Auth; OAuth, verification and reset token flows require separate end-to-end tests."
"servers":
  - "url": "http://localhost:3000"
    "description": "Local development application"
"paths":
  "/api/activity":
    "get":
      "operationId": "get_api_activity"
      "summary": "GET /api/activity"
      "security":
        - "sessionCookie": []
      "parameters":
        - "name": "cursor"
          "in": "query"
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 128
        - "name": "groupId"
          "in": "query"
          "schema":
