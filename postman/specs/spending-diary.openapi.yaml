  "schemas":
    "Money":
      "type": "integer"
      "format": "int32"
      "minimum": 1
      "maximum": 2147483647
      "description": "Integer minor units; INR amounts are paise."
    "Participant":
      "type": "object"
      "required":
        -
          "userId"
        -
          "paid"
      "properties":
        "userId":
          "type": "string"
          "minLength": 1
        "paid":
          "type": "integer"
          "format": "int32"
          "minimum": 0
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "owed":
          "type": "integer"
          "format": "int32"
          "minimum": 0
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "percentage":
          "type": "number"
          "minimum": 0
          "exclusiveMinimum": true
          "maximum": 100
        "shares":
          "type": "integer"
          "minimum": 1
    "CreateExpense":
      "type": "object"
      "required":
        -
          "description"
        -
          "category"
        -
          "amount"
        -
          "currency"
        -
          "date"
        -
          "splitType"
        -
          "participants"
      "properties":
        "groupId":
          "type": "string"
          "nullable": true
        "description":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "category":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "notes":
          "type": "string"
          "nullable": true
          "maxLength": 2000
        "amount":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "currency":
          "type": "string"
          "enum":
            -
              "INR"
        "date":
          "type": "string"
          "format": "date"
        "splitType":
          "type": "string"
          "enum":
            -
              "EQUAL"
            -
              "EXACT"
            -
              "PERCENTAGE"
            -
              "SHARES"
        "participants":
          "type": "array"
