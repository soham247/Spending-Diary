            "minLength": 1
            "maxLength": 128
        - "name": "expenseId"
          "in": "query"
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 128
      "responses":
        "200":
          "description": "Success envelope"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "data"
                "properties":
                  "data": {}
        "400":
          "description": "Invalid input"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Unauthenticated"
        "403":
          "description": "Forbidden"
        "404":
          "description": "Not found or not visible"
        "409":
          "description": "Conflict"
        "422":
          "description": "Domain invariant violated"
      "description": "Viewer-visible Activity includes nullable fromName, toName and paymentNote for settlement events, resolved through their settlement reference, including historical events. Creation, deletion and restoration preserve their existing event types and metadata."
