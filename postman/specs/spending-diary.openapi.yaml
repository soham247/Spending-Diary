  "/api/expenses":
    "get":
      "operationId": "listExpenses"
      "tags":
        - "Application"
      "security":
        - "sessionCookie": []
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required":
                  - "data"
                "properties":
                  "data":
                    "type": "object"
                    "required":
                      - "items"
                      - "nextCursor"
                    "properties":
                      "items":
                        "type": "array"
                        "items":
                          "type": "object"
                          "properties":
                            "yourShare":
                              "type": "integer"
                              "minimum": 0
                              "nullable": true
                              "description": "Viewer owed share in minor units; null when not participating."
                      "nextCursor":
                        "type": "string"
                        "nullable": true
                      "spendingTotals":
                        "type": "array"
                        "items":
                          "type": "object"
                          "required":
                            - "currency"
                            - "amount"
                          "properties":
                            "currency":
                              "type": "string"
                            "amount":
                              "type": "integer"
                              "minimum": 0
                        "description": "Present for scope=mine; excludes deleted expenses."
        "400":
          "description": "Invalid input"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Unauthenticated"
        "404":
          "description": "Not found or not visible"
      "description": "Visible expenses, newest calendar date then ID. Pages contain at most 30 rows. Deleted expenses are opt-in. scope=mine includes only the signed-in participant with a positive owed share, adds yourShare to rows and spendingTotals per currency across all matching non-deleted expenses, independent of pagination. Inclusive from/to calendar dates must be ordered. No user ID can override the session viewer."
      "parameters":
        - "name": "groupId"
          "in": "query"
          "schema":
            "type": "string"
            "maxLength": 128
        - "name": "friendId"
          "in": "query"
          "schema":
            "type": "string"
            "maxLength": 128
        - "name": "cursor"
          "in": "query"
          "schema":
            "type": "string"
            "maxLength": 128
        - "name": "kind"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "PERSONAL"
              - "SHARED"
        - "name": "deleted"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "true"
              - "false"
            "default": "false"
        - "name": "scope"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "all"
              - "mine"
            "default": "all"
        - "name": "from"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date"
        - "name": "to"
          "in": "query"
          "schema":
            "type": "string"
            "format": "date"
