          "type": "object"
          "additionalProperties":
            "type": "boolean"
        "completeOnboarding":
          "type": "boolean"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "phone":
          "type": "string"
          "maxLength": 30
          "nullable": true
        "upiId":
          "type": "string"
          "maxLength": 255
          "nullable": true
        "defaultCurrency":
          "type": "string"
          "enum":
            - "INR"
        "discoverableByEmail":
          "type": "boolean"
          "description": "Off by default. Disabling also closes pending email-origin requests; unrelated profile updates never change this setting."
    "CreateGroup":
      "type": "object"
      "required":
        - "name"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "type":
          "type": "string"
          "enum":
            - "TRIP"
            - "HOME"
            - "COUPLE"
            - "OTHER"
        "currency":
          "type": "string"
          "enum":
            - "INR"
        "simplifyDebts":
          "type": "boolean"
      "additionalProperties": false
    "UpdateGroup":
      "type": "object"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 100
        "type":
          "type": "string"
          "enum":
            - "TRIP"
            - "HOME"
            - "COUPLE"
            - "OTHER"
        "simplifyDebts":
          "type": "boolean"
        "archived":
          "type": "boolean"
