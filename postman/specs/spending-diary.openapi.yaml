"components":
  "securitySchemes":
    "maintenanceBearer":
      "type": "http"
      "scheme": "bearer"
      "description": "CRON_SECRET maintenance authority; ordinary user sessions do not grant access."
    "sessionCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "better-auth.session_token"
  "schemas":
    "Money":
      "type": "integer"
      "format": "int32"
      "minimum": 1
      "maximum": 2147483647
      "description": "Integer minor units; INR amounts are paise."
    "Participant":
      "type": "object"
      "required":
        - "userId"
        - "paid"
      "properties":
        "userId":
          "type": "string"
          "minLength": 1
        "paid":
          "type": "integer"
          "format": "int32"
          "minimum": 0
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "includedInSplit":
          "type": "boolean"
          "description": "Defaults to true when omitted. False retains a payer with zero owed; at least one participant must share the cost. Excluded participants must have zero owed, percentage or shares when supplied."
        "owed":
          "type": "integer"
          "format": "int32"
          "minimum": 0
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "percentage":
          "type": "number"
          "minimum": 0
          "maximum": 100
        "shares":
          "type": "integer"
          "minimum": 0
    "CreateExpense":
      "type": "object"
      "required":
        - "description"
        - "category"
        - "amount"
        - "currency"
        - "date"
        - "splitType"
        - "participants"
      "properties":
        "groupId":
          "type": "string"
          "nullable": true
        "description":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "category":
          "type": "string"
          "enum":
            - "Food"
            - "Groceries"
            - "Transport"
            - "Rent"
            - "Utilities"
            - "Shopping"
            - "Entertainment"
            - "Travel"
            - "Health"
            - "Other"
        "notes":
          "type": "string"
          "nullable": true
          "maxLength": 2000
        "amount":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "currency":
          "type": "string"
          "enum":
            - "INR"
        "date":
          "type": "string"
          "format": "date"
        "splitType":
          "type": "string"
          "enum":
            - "EQUAL"
            - "EXACT"
            - "PERCENTAGE"
            - "SHARES"
        "participants":
          "type": "array"
          "minItems": 1
          "maxItems": 100
          "items":
            "type": "object"
            "required":
              - "userId"
              - "paid"
            "properties":
              "userId":
                "type": "string"
                "minLength": 1
              "paid":
                "type": "integer"
                "format": "int32"
                "minimum": 0
                "maximum": 2147483647
                "description": "Integer minor units; INR amounts are paise."
              "includedInSplit":
                "type": "boolean"
                "description": "Defaults to true when omitted. False retains a payer with zero owed; at least one participant must share the cost. Excluded participants must have zero owed, percentage or shares when supplied."
              "owed":
                "type": "integer"
                "format": "int32"
                "minimum": 0
                "maximum": 2147483647
                "description": "Integer minor units; INR amounts are paise."
              "percentage":
                "type": "number"
                "minimum": 0
                "maximum": 100
              "shares":
                "type": "integer"
                "minimum": 0
    "EditExpense":
      "type": "object"
      "required":
        - "version"
      "properties":
        "version":
          "type": "integer"
          "minimum": 1
        "description":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "category":
          "type": "string"
          "enum":
            - "Food"
            - "Groceries"
            - "Transport"
            - "Rent"
            - "Utilities"
            - "Shopping"
            - "Entertainment"
            - "Travel"
            - "Health"
            - "Other"
        "notes":
          "type": "string"
          "nullable": true
          "maxLength": 2000
        "amount":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 2147483647
          "description": "Integer minor units; INR amounts are paise."
        "currency":
          "type": "string"
          "enum":
            - "INR"
        "date":
          "type": "string"
          "format": "date"
        "splitType":
          "type": "string"
          "enum":
            - "EQUAL"
            - "EXACT"
            - "PERCENTAGE"
            - "SHARES"
        "participants":
          "type": "array"
          "minItems": 1
          "maxItems": 100
          "items":
            "type": "object"
            "required":
              - "userId"
              - "paid"
            "properties":
              "userId":
                "type": "string"
                "minLength": 1
              "paid":
                "type": "integer"
                "format": "int32"
                "minimum": 0
                "maximum": 2147483647
                "description": "Integer minor units; INR amounts are paise."
              "includedInSplit":
                "type": "boolean"
                "description": "Defaults to true when omitted. False retains a payer with zero owed; at least one participant must share the cost. Excluded participants must have zero owed, percentage or shares when supplied."
              "owed":
                "type": "integer"
                "format": "int32"
                "minimum": 0
                "maximum": 2147483647
                "description": "Integer minor units; INR amounts are paise."
              "percentage":
                "type": "number"
                "minimum": 0
                "maximum": 100
              "shares":
                "type": "integer"
                "minimum": 0
    "CreateSettlement":
      "type": "object"
      "required":
        - "fromUserId"
        - "toUserId"
        - "amount"
        - "currency"
        - "method"
        - "date"
      "properties":
        "groupId":
          "type": "string"
          "nullable": true
        "fromUserId":
          "type": "string"
          "minLength": 1
        "toUserId":
          "type": "string"
          "minLength": 1
        "amount":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 2147483647
