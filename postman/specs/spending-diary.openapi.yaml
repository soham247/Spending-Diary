          "maxLength": 64
          "pattern": "^[a-f0-9]{64}$"
      "additionalProperties": false
    "ClaimReport":
      "type": "object"
      "properties":
        "reason":
          "type": "string"
          "maxLength": 2000
      "additionalProperties": false
    "DeleteAccount":
      "type": "object"
      "properties":
        "password":
          "type": "string"
          "maxLength": 128
      "additionalProperties": false
    "Subscription":
      "type": "object"
