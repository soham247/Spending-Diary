          "maxLength": 30
        "groupId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
      "additionalProperties": false
    "Invite":
      "type": "object"
      "required":
        - "type"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "GROUP_LINK"
            - "DIRECT"
            - "PERSONAL"
        "groupId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "placeholderId":
          "type": "string"
          "minLength": 1
