      "properties":
        "blocked":
          "type": "boolean"
        "nickname":
          "type": "string"
          "maxLength": 100
          "nullable": true
      "additionalProperties": false
    "PaymentContext":
      "type": "array"
      "items":
        "type": "object"
        "required":
          - "id"
          - "name"
          - "currency"
          - "people"
        "properties":
          "id":
            "type": "string"
            "description": "direct or a group ID"
          "name":
            "type": "string"
          "currency":
            "type": "string"
            "enum":
              - "INR"
          "people":
            "type": "array"
            "items":
              "type": "object"
              "required":
                - "id"
                - "name"
                - "upiId"
                - "net"
                - "restricted"
              "properties":
                "id":
                  "type": "string"
                "name":
                  "type": "string"
                "upiId":
                  "type": "string"
                  "nullable": true
                "net":
                  "type": "integer"
                  "description": "Viewer net against this person in this scope; positive means owed to viewer."
                "restricted":
                  "type": "boolean"
                  "description": "Only repayment up to the outstanding pairwise debt is permitted."
    "PeopleSearch":
      "type": "object"
      "required":
        - "query"
      "additionalProperties": false
      "properties":
        "query":
          "type": "string"
          "minLength": 1
