        "429":
          "description": "RATE_LIMITED: viewer allowance exhausted"
          "headers":
            "Retry-After":
              "schema":
                "type": "integer"
                "minimum": 1
              "description": "Seconds until retry"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "503":
          "description": "RATE_LIMIT_UNAVAILABLE: protection unavailable; operation not executed"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Requires live proof: shared active group for userId; enabled discovery and matching full email for userId+email; or a valid PERSONAL token. IDs and stale search results alone confer no authority. Pending requests grant no financial or group permissions. Crossed requests reuse pending state without accepting. Rate limit: 10 request attempts/minute/viewer, including failed or repeated requests. Declined non-link requests have a 7-day resend cooldown; a link can bypass an email-origin decline, while the same declined link retains its cooldown."
      "parameters":
